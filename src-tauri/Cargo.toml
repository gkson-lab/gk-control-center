[package]
name = "gkcc"
version = "1.1.0"
description = "gklabs Device Manager"
authors = ["you"]
edition = "2021"

[lib]
name = "gkcc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
tiny_http = "0.12"

# Shrink the shipped release binary as much as possible.
[profile.release]
opt-level = "z"     # optimize for size
lto = true          # link-time optimization
codegen-units = 1   # better optimization, smaller output
panic = "abort"     # drop unwinding machinery
strip = true        # strip symbols
