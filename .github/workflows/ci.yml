# Checks every push and pull request: the interface type-checks and builds,
# and the backend compiles and passes its tests on Windows and Linux.

name: Check

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: npx tsc -p tsconfig.app.json
      - run: npx vite build
      - run: cargo test --lib
        working-directory: src-tauri
